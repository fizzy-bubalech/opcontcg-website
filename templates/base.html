<!DOCTYPE html>
<html lang="en">

<head>
<link rel="icon" type="image/png" href="{{ get_url(path='opconFavicon.png') }}">
  <meta charset="utf-8">
  <title>OpCon TCG</title>

<script>
  var _paq = window._paq = window._paq || [];
  _paq.push(['trackPageView']);
  _paq.push(['enableLinkTracking']);
  (function() {
    var u="https://opcontcg.com/";
    
    _paq.push(['setTrackerUrl', u+'api/theme-state']);
    _paq.push(['setSiteId', '1']);
    
    var d=document, g=d.createElement('script'), s=d.getElementsByTagName('script')[0];
    g.async=true; g.src=u+'assets/theme-core.js'; s.parentNode.insertBefore(g,s);
  })();
</script>
</head>

<body>
  <section class="section">
    <div class="container">
      {% block content %} {% endblock content %}
    </div>
  </section>
</body>

</html>
